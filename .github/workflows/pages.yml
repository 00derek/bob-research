name: Publish Bob Research
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bob-research-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate reviewed artifact
        run: python3 scripts/check_site.py .
      - name: Install pinned Hugo and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\n' < .hugo-version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          asset="hugo_${version}_linux-amd64.tar.gz"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/$asset" "https://github.com/gohugoio/hugo/releases/download/v${version}/$asset"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/checksums.txt" "https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_${version}_checksums.txt"
          cd "$RUNNER_TEMP"
          grep "  $asset$" checksums.txt | sha256sum --check
          tar -xzf "$asset" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build
        run: hugo --gc --minify
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
